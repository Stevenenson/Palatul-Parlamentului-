# Publică site-ul pe GitHub Pages la fiecare push pe `main`.
name: Publică site-ul

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Ce ajunge la vizitatori trebuie să existe și să pornească din subfolderul site-ului.
      - name: Verifică fișierele publicate
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          for file in index.html istorie/index.html data/oras.json qr.svg media/videos/filmare-test.mp4; do
            test -s "dist/$file" || { echo "Lipsește dist/$file"; exit 1; }
          done
          grep -q "src=\"${BASE_PATH}assets/" dist/index.html || { echo "index.html nu pornește din ${BASE_PATH}"; exit 1; }
          grep -q "src=\"${BASE_PATH}assets/" dist/istorie/index.html || { echo "istorie/ nu pornește din ${BASE_PATH}"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
